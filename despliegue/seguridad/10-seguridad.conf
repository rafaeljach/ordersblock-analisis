# /etc/systemd/system/ordersblock-analisis.service.d/10-seguridad.conf
# Endurecimiento del motor. Se quita borrando este archivo + systemctl daemon-reload + restart.
[Service]
# Mismo arranque, sin anunciar "uvicorn" en las respuestas y confiando el X-Forwarded-* solo al proxy local
ExecStart=
ExecStart=/opt/ordersblock_analisis/venv/bin/uvicorn api:app --host 127.0.0.1 --port 8091 --workers 1 --proxy-headers --forwarded-allow-ips 127.0.0.1 --no-server-header
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
# Lo unico que el motor escribe: su memoria SQLite y escaner.json
ReadWritePaths=/opt/ordersblock_analisis
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
UMask=0077
