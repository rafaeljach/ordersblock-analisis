# /etc/nginx/sites-available/analisis-tunel  — entrada SOLO por Cloudflare Tunnel (cloudflared en este droplet).
# Escucha unicamente en 127.0.0.1: desde Internet no se puede llegar, ni con la IP del droplet.
server {
    listen 127.0.0.1:8092;
    server_name analisis.ordersblock.com;

    # cloudflared reenvia la IP real del visitante en CF-Connecting-IP; solo se cree si viene de 127.0.0.1
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 16k;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    access_log /var/log/nginx/analisis-tunel.access.log;

    location / {
        limit_except GET HEAD OPTIONS { deny all; }
        limit_req zone=ob_analisis burst=40 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_hide_header Server;
        proxy_read_timeout 75s;
    }
}
