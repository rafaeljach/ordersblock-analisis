# /etc/nginx/conf.d/00-ordersblock-seguridad.conf  (contexto http)
# Ocultar la version de nginx en todas las respuestas.
server_tokens off;
# Origen de la conexion: 1 si viene de Cloudflare (se mira la IP que conecta, no la cabecera).
geo $realip_remote_addr $ob_desde_cloudflare {
    default 0;
    include /etc/nginx/cloudflare-geo.conf;
}
# Limite por IP real. Las peticiones que traen X-API-Key (el Worker de ordersblock.com) no cuentan aqui:
# todas salen de pocas IPs de Cloudflare y se frenarian entre si. El motor valida la clave y tiene su propio
# limite; una clave falsa solo consigue un 401 o el limite del motor.
map $http_x_api_key $ob_limite_clave { "" $binary_remote_addr; default ""; }
limit_req_zone $ob_limite_clave zone=ob_analisis:10m rate=10r/s;
limit_req_status 429;
