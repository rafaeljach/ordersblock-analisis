# /etc/nginx/sites-available/analisis.ordersblock.com  (reemplaza a la version anterior; respaldo automatico)
server {
    listen 80;
    listen [::]:80;
    server_name analisis.ordersblock.com;

    # IP real del visitante desde Cloudflare (solo se cree la cabecera si la conexion viene de Cloudflare)
    include /etc/nginx/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;

    # Solo Cloudflare: cualquier conexion directa a la IP del droplet se corta sin respuesta
    if ($ob_desde_cloudflare = 0) { return 444; }

    # La API solo recibe GET pequenos
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    location / {
        limit_except GET HEAD OPTIONS { deny all; }
        limit_req zone=ob_analisis burst=40 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_hide_header Server;
        proxy_read_timeout 75s;
    }
}
