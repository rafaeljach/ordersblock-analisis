# /etc/nginx/sites-available/analisis.ordersblock.com
# Opción A: si el droplet ya sirve ordersblock.com con nginx + Cloudflare (proxy naranja).
server {
    listen 80;
    server_name analisis.ordersblock.com;

    # Solo Cloudflare debe llegar aquí; la IP real viene en CF-Connecting-IP
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 75s;
    }
}
